  <style>
    :root {
      --bg-deep: #060a15;
      --bg-navy: #0c1733;
      --bg-card: #0e1a36;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.28);
      --gold-faint: rgba(212, 175, 55, 0.12);
      --text: #f5f7fb;
      --muted: #a6b2cb;
      --border: rgba(212, 175, 55, 0.25);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at top center, #11214a 0%, var(--bg-deep) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }
    .shell {
      max-width: 920px;
      margin: 0 auto;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .frame {
      flex: 1;
      border: 1px solid var(--gold-soft);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(14, 26, 54, 0.86) 0%, rgba(6, 10, 21, 0.94) 100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 20px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gold-faint);
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1.5px solid var(--gold);
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    .brand-text h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.02em;
      font-weight: 700;
      color: #fff;
    }
    .brand-text p {
      margin: 3px 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .search-wrap {
      flex: 1 1 220px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(6, 10, 21, 0.72);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.14);
    }
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--gold);
      color: #090e1c;
      border-color: var(--gold);
    }
    .section-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 4px;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 20px 14px;
      padding: 6px 2px 12px;
    }
    .icon-btn {
      appearance: none;
      background: none;
      border: none;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.14s ease;
    }
    .icon-btn:active { transform: scale(0.95); }
    .icon-circle {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #1d356e 0%, #091124 72%);
      border: 2px solid var(--gold);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(212, 175, 55, 0.14);
      display: grid;
      place-items: center;
      position: relative;
    }
    .icon-circle::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.35);
      pointer-events: none;
    }
    .icon-letter {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .icon-label {
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.25;
      color: #fff;
    }
    .icon-sub {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: -5px;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .footer-note {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--gold-faint);
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      background: linear-gradient(180deg, #0f1d3e 0%, #070c1a 100%);
      border: 1.5px solid var(--gold);
      border-radius: 22px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--gold-faint);
      background: rgba(6, 10, 21, 0.45);
    }
    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-badge-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: radial-gradient(circle at 30% 25%, #1d356e 0%, #091124 75%);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 800;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .modal-title-wrap h2 {
      margin: 0;
      font-size: 1.25rem;
      color: #fff;
    }
    .modal-title-wrap span {
      display: inline-block;
      margin-top: 2px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 700;
    }
    .close-btn {
      appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .modal-body {
      padding: 16px 18px 22px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .info-table th,
    .info-table td {
      text-align: left;
      vertical-align: top;
      padding: 11px 13px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.14);
      font-size: 0.93rem;
      line-height: 1.48;
    }
    .info-table tr:last-child th,
    .info-table tr:last-child td { border-bottom: none; }
    .info-table th {
      width: 34%;
      color: var(--gold);
      font-weight: 700;
      background: rgba(212, 175, 55, 0.06);
      font-size: 0.82rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .info-table td {
      color: var(--text);
      background: rgba(6, 10, 21, 0.35);
    }
    .modal-source {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px solid rgba(212, 175, 55, 0.14);
      padding-top: 10px;
    }
    .scripture-ref {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(212, 175, 55, 0.32);
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    @media (max-width: 520px) {
      .info-table th, .info-table td {
        display: block;
        width: 100%;
      }
      .info-table th {
        padding-bottom: 4px;
        border-bottom: none;
      }
      .info-table td {
        padding-top: 2px;
      }
    }
  </style>
</head>

    let activeFilter = "All";
    let searchTerm = "";

    const grid = document.getElementById("iconGrid");
    const countLabel = document.getElementById("countLabel");
    const searchInput = document.getElementById("searchInput");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBadge = document.getElementById("modalBadge");
    const modalTitle = document.getElementById("modalTitle");
    const modalCategory = document.getElementById("modalCategory");
    const modalTableBody = document.getElementById("modalTableBody");
    const modalSource = document.getElementById("modalSource");
    const closeModalBtn = document.getElementById("closeModal");

    function renderGrid() {
      const items = [...BIBLICAL_ICONS]
        .sort((a, b) => a.name.localeCompare(b.name))
        .filter((item) => activeFilter === "All" || item.category === activeFilter)
        .filter((item) => {
          if (!searchTerm) return true;
          const q = searchTerm.toLowerCase();
          return (
            item.name.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q) ||
            item.rows.some(([k, v, r]) => k.toLowerCase().includes(q) || v.toLowerCase().includes(q) || (r && r.toLowerCase().includes(q)))
          );
        });

      countLabel.textContent = `${items.length} ${items.length === 1 ? "icon" : "icons"}`;
      grid.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No icons match your search yet.";
        grid.appendChild(empty);
        return;
      }

      for (const item of items) {
        const btn = document.createElement("button");
        btn.className = "icon-btn";
        btn.type = "button";
        btn.setAttribute("aria-label", `Open ${item.name}`);
        btn.innerHTML = `
          <div class="icon-circle">
            <span class="icon-letter">${item.name.charAt(0).toUpperCase()}</span>
          </div>
          <span class="icon-label">${item.name}</span>
          <span class="icon-sub">${item.category}</span>
        `;
        btn.addEventListener("click", () => openModal(item));
        grid.appendChild(btn);
      }
    }

    function openModal(item) {
      modalBadge.textContent = item.name.charAt(0).toUpperCase();
      modalTitle.textContent = item.name;
      modalCategory.textContent = item.shortTag ? `${item.category} · ${item.shortTag}` : item.category;
      modalTableBody.innerHTML = "";

      for (const [label, value, ref] of item.rows) {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.scope = "row";
        th.textContent = label;
        const td = document.createElement("td");
        const textDiv = document.createElement("div");
        textDiv.textContent = value;
        td.appendChild(textDiv);
        if (ref) {
          const refEl = document.createElement("span");
          refEl.className = "scripture-ref";
          refEl.textContent = ref;
          td.appendChild(refEl);
        }
        tr.appendChild(th);
        tr.appendChild(td);
        modalTableBody.appendChild(tr);
      }

      if (item.source) {
        modalSource.textContent = `Source: ${item.source}`;
        modalSource.style.display = "block";
      } else {
        modalSource.textContent = "";
        modalSource.style.display = "none";
      }
      modalBackdrop.classList.add("open");
      document.querySelector(".modal-body").scrollTop = 0;
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    document.querySelectorAll(".pill").forEach((pill) => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((p) => p.classList.remove("active"));
        pill.classList.add("active");
        activeFilter = pill.dataset.filter;
        renderGrid();
      });
    });

    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value.trim();
      renderGrid();
    });

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    renderGrid();
  </script>
